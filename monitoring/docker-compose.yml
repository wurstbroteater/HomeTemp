services:
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=370d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana
    container_name: grafana
    network_mode: host
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/dashboards/:/var/lib/grafana/dashboards
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboard.yaml
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasource.yaml
      - ./../data/pictures/:/usr/share/grafana/public/img/_hometempuser 
    environment:
      # yesoreyeram-infinity-datasource is not designed for handling a huge amount of data. When inlining the data, make sure they are small snippets less than 1MB of size.
      - GF_INSTALL_PLUGINS=speakyourcode-button-panel,yesoreyeram-infinity-datasource
      - GF_SECURITY_ADMIN_PASSWORD=admin  
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_SERVER_HTTP_ADDR=0.0.0.0 
      - GF_SERVER_HTTP_PORT=3000

  loki:
    image: grafana/loki:3.7.0
    container_name: loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:32000
      - /etc/alloy/config.alloy
    ports:
      - "32000:32000"
    volumes:
      # Alloy configuration
      - ./config.alloy:/etc/alloy/config.alloy:ro
      # mount project as read-only to allow Alloy to read logs from it
      - ./../.:/var/log/hometemp:ro
      # Remember log positions
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki

volumes:
  grafana-storage:
  prometheus-data:
  loki-data:
  alloy-data:
